name: retrieval-evaluation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.7
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests experiments/haystack1
      - run: uv run --no-sync pytest -m 'not integration' -q
      - run: uv run --no-sync retrieval-eval audit
      - run: uv build --wheel --out-dir artifacts/wheels
      - run: uv run --no-sync python scripts/verify_wheel.py artifacts/wheels/*.whl
  real-models:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKENIZERS_PARALLELISM: 'false'
      RUN_MODEL_TESTS: '1'
      HAYSTACK_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.7
      - run: uv sync --locked --extra dev
      # Only the two revision-pinned CPU models are downloaded, about 365 MB.
      - run: uv run --no-sync retrieval-eval download
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync retrieval-eval run --output artifacts/ci-run --evidence evidence/ci-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: evidence/ci-benchmark.json
